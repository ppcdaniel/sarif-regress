name: Temporary holdout validation bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-build-test:
    name: Generate locks and compile validation infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install projection verifier runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.13'

      - name: Reproduce committed source transformations and SARIF projections
        shell: bash
        run: |
          set -euo pipefail
          readonly projection_root="${RUNNER_TEMP}/holdout-projection-reproduction"
          python -B validation/tools/capture/verify_capture_provenance.py \
            --repository-root .
          python -B validation/tools/capture/verify_source_transformations.py \
            --repository-root .
          python -B validation/tools/capture/verify_projected_holdout.py \
            --repository-root . \
            --output-root "${projection_root}"
          python -B validation/tools/capture/test_capture_tools.py

      - name: Generate dependency locks
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore \
            validation/tools/SarifRegress.Validation/SarifRegress.Validation.csproj \
            --use-lock-file
          dotnet restore \
            tests/SarifRegress.ValidationTests/SarifRegress.ValidationTests.csproj \
            --use-lock-file

      - name: Build validation infrastructure
        shell: bash
        run: |
          set -euo pipefail
          dotnet build \
            validation/tools/SarifRegress.Validation/SarifRegress.Validation.csproj \
            --configuration Release \
            --no-restore \
            --warnaserror

      - name: Run validation infrastructure tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test \
            tests/SarifRegress.ValidationTests/SarifRegress.ValidationTests.csproj \
            --configuration Release \
            --no-restore \
            --warnaserror \
            --filter 'FullyQualifiedName!~TrackedOutputTests'

      - name: Upload generated locks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holdout-generated-locks
          path: |
            validation/tools/SarifRegress.Validation/packages.lock.json
            tests/SarifRegress.ValidationTests/packages.lock.json
          if-no-files-found: warn
          retention-days: 7
