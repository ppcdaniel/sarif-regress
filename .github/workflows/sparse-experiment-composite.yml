name: Compose authenticated sparse experiment evidence

on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact lowercase source commit shared by all evidence runs
        required: true
        type: string
      release_run_id:
        description: Successful Independent holdout validation run ID
        required: true
        type: string
      determinism_run_id:
        description: Successful Determinism run ID
        required: true
        type: string
      resources_run_id:
        description: Successful Extended benchmark run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  compose:
    name: Authenticate and compose exact-head evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the supplied exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and input identities
        shell: bash
        env:
          DETERMINISM_RUN_ID: ${{ inputs.determinism_run_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RESOURCES_RUN_ID: ${{ inputs.resources_run_id }}
          SOURCE_HEAD: ${{ inputs.source_head }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          test "${SOURCE_HEAD}" != "$(printf '0%.0s' {1..40})"
          [[ "${RELEASE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${DETERMINISM_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${RESOURCES_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${RELEASE_RUN_ID}" != "${DETERMINISM_RUN_ID}"
          test "${RELEASE_RUN_ID}" != "${RESOURCES_RUN_ID}"
          test "${DETERMINISM_RUN_ID}" != "${RESOURCES_RUN_ID}"
          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install exact offline compositor runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.13'

      - name: Record unmodified GitHub workflow and artifact metadata
        id: metadata
        shell: bash
        env:
          DETERMINISM_RUN_ID: ${{ inputs.determinism_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RESOURCES_RUN_ID: ${{ inputs.resources_run_id }}
        run: |
          set -euo pipefail
          readonly metadata_root='artifacts/composite-metadata'
          mkdir -p -- "${metadata_root}"
          fetch() {
            local destination="$1"
            local endpoint="$2"
            curl \
              --disable \
              --fail-with-body \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --proto '=https' \
              --show-error \
              --silent \
              --tlsv1.2 \
              --output "${destination}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/${endpoint}"
            test -s "${destination}"
            test ! -L "${destination}"
          }
          for role in release determinism resources; do
            case "${role}" in
              release) run_id="${RELEASE_RUN_ID}" ;;
              determinism) run_id="${DETERMINISM_RUN_ID}" ;;
              resources) run_id="${RESOURCES_RUN_ID}" ;;
            esac
            fetch \
              "${metadata_root}/${role}-run.json" \
              "actions/runs/${run_id}"
            fetch \
              "${metadata_root}/${role}-artifacts.json" \
              "actions/runs/${run_id}/artifacts?per_page=100"
          done

          artifact_ids() {
            local role="$1"
            shift
            local ids=()
            local name
            local artifact_id
            for name in "$@"; do
              artifact_id="$(
                jq -er \
                  --arg name "${name}" \
                  '[.artifacts[] | select(.name == $name) | .id] |
                   if length == 1 then .[0] | tostring
                   else error("required artifact name is not unique") end' \
                  "${metadata_root}/${role}-artifacts.json"
              )"
              [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
              ids+=("${artifact_id}")
            done
            local joined
            local IFS=,
            joined="${ids[*]}"
            printf '%s' "${joined}"
          }

          release_ids="$(artifact_ids release \
            holdout-linux \
            holdout-windows \
            holdout-cross-platform)"
          determinism_ids="$(artifact_ids determinism \
            determinism-linux \
            determinism-windows \
            cross-platform-determinism)"
          resource_names=()
          for size in 1000 10000 100000; do
            for dataset in unique pathological; do
              resource_names+=(
                "benchmark-${size}-${dataset}-linux"
                "benchmark-${size}-${dataset}-windows"
              )
            done
          done
          resource_names+=(benchmark-cross-platform)
          resource_ids="$(artifact_ids resources "${resource_names[@]}")"
          {
            echo "release_artifact_ids=${release_ids}"
            echo "determinism_artifact_ids=${determinism_ids}"
            echo "resource_artifact_ids=${resource_ids}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download release artifacts with archive-digest verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.metadata.outputs.release_artifact_ids }}
          path: artifacts/download/release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          merge-multiple: false
          digest-mismatch: error

      - name: Download determinism artifacts with archive-digest verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.metadata.outputs.determinism_artifact_ids }}
          path: artifacts/download/determinism
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.determinism_run_id }}
          merge-multiple: false
          digest-mismatch: error

      - name: Download benchmark cell artifacts with archive-digest verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.metadata.outputs.resource_artifact_ids }}
          path: artifacts/download/resources
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resources_run_id }}
          merge-multiple: false
          digest-mismatch: error

      - name: Test and run the offline evidence compositor
        shell: bash
        env:
          DETERMINISM_RUN_ID: ${{ inputs.determinism_run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RESOURCES_RUN_ID: ${{ inputs.resources_run_id }}
          SOURCE_HEAD: ${{ inputs.source_head }}
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          python3 -B validation/tools/test_compose_sparse_experiment_evidence.py -v
          python3 -B validation/tools/compose_sparse_experiment_evidence.py \
            --repository-root . \
            --metadata-root artifacts/composite-metadata \
            --release-root artifacts/download/release \
            --determinism-root artifacts/download/determinism \
            --resources-root artifacts/download/resources \
            --release-run-id "${RELEASE_RUN_ID}" \
            --determinism-run-id "${DETERMINISM_RUN_ID}" \
            --resources-run-id "${RESOURCES_RUN_ID}" \
            --source-head "${SOURCE_HEAD}" \
            --output-root artifacts/sparse-experiment-composite-candidate

      - name: Verify the candidate with the strict contamination scanner
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          SOURCE_HEAD: ${{ inputs.source_head }}
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          readonly candidate_repository="${RUNNER_TEMP}/composite-repository"
          readonly candidate_research="${candidate_repository}/validation/research/sparse-sarif"
          test ! -e "${candidate_repository}"
          mkdir -p -- "${candidate_repository}"
          git archive --format=tar "${SOURCE_HEAD}" |
            tar --extract --file=- --directory="${candidate_repository}"
          test "${candidate_research}" = \
            "${RUNNER_TEMP}/composite-repository/validation/research/sparse-sarif"
          rm -rf -- "${candidate_research}/expected"
          cp -a -- \
            artifacts/sparse-experiment-composite-candidate/expected \
            "${candidate_research}/expected"
          python3 -B \
            validation/research/sparse-sarif/tools/scan_contamination.py \
            --research-root "${candidate_research}"
          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload authenticated composite candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparse-experiment-composite-candidate-${{ inputs.source_head }}
          path: artifacts/sparse-experiment-composite-candidate
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
