name: Independent holdout validation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.config/dotnet-tools.json'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'SarifRegress.slnx'
      - 'corpus/schema/**'
      - 'scripts/verify.ps1'
      - 'scripts/verify.sh'
      - 'scripts/validate-holdout.ps1'
      - 'scripts/validate-holdout.sh'
      - 'schemas/**'
      - 'src/**'
      - 'tests/SarifRegress.ValidationTests/**'
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Raw PMD bytes and runner-environment evidence remain workflow artifacts.
  # Stable projections/audits are committed and compared byte-for-byte; raw
  # hashes are cross-bound through the manifest and audits. The dynamic capture
  # environment and aggregate artifact checksum are verified, not compared to
  # committed bytes, because source SHA and runner image version vary per run.
  sparse-admission:
    name: Admit research corpus (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            os: ubuntu-24.04
            python: '3.12.13'
          - label: windows
            os: windows-2025
            # Python 3.12.13 has no Windows x64 binary in setup-python's
            # manifest. Keep the capture runtime at 3.12.13 on Ubuntu and pin
            # this cross-platform admission check to the final Windows-binary
            # 3.12 patch instead.
            python: '3.12.10'

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install exact Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Test and apply complete contamination admission
        shell: bash
        env:
          EXPECTED_PYTHON_VERSION: ${{ matrix.python }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          python -B - <<'PY'
          import os
          import platform

          expected = os.environ["EXPECTED_PYTHON_VERSION"]
          if platform.python_version() != expected:
              raise SystemExit(
                  f"Expected Python {expected}, got {platform.python_version()}."
              )
          PY
          python -B \
            validation/research/sparse-sarif/tools/test_scan_contamination.py \
            -v
          python -B \
            validation/research/sparse-sarif/tools/scan_contamination.py \
            --research-root validation/research/sparse-sarif
          python -B - <<'PY'
          from pathlib import Path

          root = Path("validation/research/sparse-sarif/tools")
          prohibited = sorted(root.rglob("__pycache__"))
          prohibited.extend(sorted(root.rglob("*.pyc")))
          prohibited.extend(sorted(root.rglob("*.pyo")))
          if prohibited:
              raise SystemExit(f"Python bytecode output is prohibited: {prohibited[0]}")
          PY
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  sparse-capture:
    name: Recapture and verify authentic PMD research SARIF
    needs: sparse-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload-sparse-evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-sparse-evidence.outputs.artifact-digest }}

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install exact Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.13'

      - name: Revalidate promoted corpus before producer setup
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          python3 -B \
            validation/research/sparse-sarif/tools/scan_contamination.py \
            --research-root validation/research/sparse-sarif

      - name: Install exact Java runtime
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17.0.19+10'

      - name: Verify capture tools statically
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          bash -n validation/research/sparse-sarif/tools/capture_pmd.sh
          python3 -B - <<'PY'
          from pathlib import Path

          root = Path("validation/research/sparse-sarif/tools")
          names = (
              "project_pmd_sarif.py",
              "verify_pmd_capture.py",
              "test_pmd_capture_tools.py",
          )
          for name in names:
              path = root / name
              compile(path.read_bytes(), str(path), "exec")
          PY
          (
            cd validation/research/sparse-sarif/tools
            python3 -B test_pmd_capture_tools.py -v
          )
          if find validation/research/sparse-sarif/tools \
            \( -type d -name __pycache__ -o -type f -name '*.py[co]' \) \
            -print -quit | grep -q .; then
            echo 'Python bytecode output is prohibited.' >&2
            exit 1
          fi

      - name: Capture and verify authentic PMD SARIF
        shell: bash
        env:
          CAPTURE_OUTPUT_ROOT: ${{ runner.temp }}/sparse-sarif-pmd-capture
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          test "${ImageOS:-}" = 'ubuntu24'
          [[ "${ImageVersion:-}" =~ ^[0-9]{8}\.[0-9]+\.[0-9]+$ ]]
          ./validation/research/sparse-sarif/tools/capture_pmd.sh \
            --output-root "${CAPTURE_OUTPUT_ROOT}" \
            --source-sha "${EXPECTED_SOURCE_SHA}"
          if find validation/research/sparse-sarif/tools \
            \( -type d -name __pycache__ -o -type f -name '*.py[co]' \) \
            -print -quit | grep -q .; then
            echo 'Python bytecode output is prohibited.' >&2
            exit 1
          fi

      - name: Compare staged evidence with promoted corpus
        shell: bash
        env:
          CAPTURE_OUTPUT_ROOT: ${{ runner.temp }}/sparse-sarif-pmd-capture
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          python3 -B \
            validation/research/sparse-sarif/tools/verify_pmd_capture.py \
            verify-promotion \
            --research-root validation/research/sparse-sarif \
            --capture-root "${CAPTURE_OUTPUT_ROOT}"

      - name: Verify post-capture source integrity
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload raw and projected capture evidence
        id: upload-sparse-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparse-sarif-pmd-capture-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/sparse-sarif-pmd-capture
          if-no-files-found: error
          retention-days: 30

  promoted-capture-provenance:
    name: Authenticate promoted PMD capture provenance
    needs: sparse-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install exact Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.13'

      - name: Download promoted capture by immutable artifact identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '8823830998'
          path: ${{ runner.temp }}/promoted-pmd-capture
          github-token: ${{ github.token }}
          repository: ppcdaniel/sarif-regress
          run-id: '30717611507'
          digest-mismatch: error

      - name: Authenticate promoted artifact metadata and frozen inputs
        shell: bash
        env:
          ARTIFACT_ID: '8823830998'
          ARTIFACT_NAME: sparse-sarif-pmd-bootstrap-3a398396213cac416f1b1237c605dd2d119d572f
          ARTIFACT_DIGEST: 1f96943d599c4c0a9e68387131d873e23281d248e4a462e79829f0140274e0e4
          CAPTURE_SOURCE_SHA: 3a398396213cac416f1b1237c605dd2d119d572f
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTED_CAPTURE_ROOT: ${{ runner.temp }}/promoted-pmd-capture
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          RUN_ID: '30717611507'
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          readonly metadata_path="${RUNNER_TEMP}/promoted-pmd-artifact.json"
          curl \
            --disable \
            --fail-with-body \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --location \
            --proto '=https' \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "${metadata_path}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          jq -e \
            --arg artifact_id "${ARTIFACT_ID}" \
            --arg artifact_name "${ARTIFACT_NAME}" \
            --arg artifact_digest "sha256:${ARTIFACT_DIGEST}" \
            --arg run_id "${RUN_ID}" \
            --arg source_sha "${CAPTURE_SOURCE_SHA}" \
            '(.id | tostring) == $artifact_id and
             .name == $artifact_name and
             .digest == $artifact_digest and
             .expired == false and
             (.workflow_run.id | tostring) == $run_id and
             .workflow_run.head_sha == $source_sha' \
            "${metadata_path}" >/dev/null
          python3 -B \
            validation/research/sparse-sarif/tools/verify_pmd_capture.py \
            verify-promotion \
            --research-root validation/research/sparse-sarif \
            --capture-root "${PROMOTED_CAPTURE_ROOT}"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          research_root = Path("validation/research/sparse-sarif")
          manifest = json.loads((research_root / "manifest.json").read_bytes())
          capture = manifest["producer"]["capture"]
          capture_sha = capture["sourceHeadSha"]
          if capture_sha != os.environ["CAPTURE_SOURCE_SHA"]:
              raise SystemExit("Manifest capture source SHA differs from workflow authority.")
          workflow = capture["workflow"]
          expected_workflow = {
              "runId": int(os.environ["RUN_ID"]),
              "artifactId": int(os.environ["ARTIFACT_ID"]),
              "artifactName": os.environ["ARTIFACT_NAME"],
              "artifactDigest": os.environ["ARTIFACT_DIGEST"],
          }
          if workflow != expected_workflow:
              raise SystemExit("Manifest workflow provenance differs from GitHub authority.")
          paths = []
          for family in manifest["families"]:
              paths.extend(
                  (
                      research_root / family["labelsPath"],
                      research_root / family["rulesetPath"],
                      research_root / family["baseline"]["sourceRoot"],
                      research_root / family["candidate"]["sourceRoot"],
                  )
              )
          subprocess.run(
              [
                  "git",
                  "diff",
                  "--exit-code",
                  capture_sha,
                  "--",
                  *(path.as_posix() for path in paths),
              ],
              check=True,
          )
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  recapture-attestation:
    name: Authenticate uploaded exact-head PMD recapture
    needs: sparse-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install exact Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.13'

      - name: Download exact uploaded artifact by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sparse-capture.outputs.artifact_id }}
          path: ${{ runner.temp }}/exact-head-pmd-capture
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Authenticate uploaded artifact metadata and content
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.sparse-capture.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.sparse-capture.outputs.artifact_id }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RECAPTURE_ROOT: ${{ runner.temp }}/exact-head-pmd-capture
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          readonly artifact_name="sparse-sarif-pmd-capture-${EXPECTED_SOURCE_SHA}"
          readonly metadata_path="${RUNNER_TEMP}/exact-head-pmd-artifact.json"
          curl \
            --disable \
            --fail-with-body \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --location \
            --proto '=https' \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "${metadata_path}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          jq -e \
            --arg artifact_id "${ARTIFACT_ID}" \
            --arg artifact_name "${artifact_name}" \
            --arg artifact_digest "sha256:${ARTIFACT_DIGEST}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg source_sha "${EXPECTED_SOURCE_SHA}" \
            '(.id | tostring) == $artifact_id and
             .name == $artifact_name and
             .digest == $artifact_digest and
             .expired == false and
             (.workflow_run.id | tostring) == $run_id and
             .workflow_run.head_sha == $source_sha' \
            "${metadata_path}" >/dev/null
          python3 -B \
            validation/research/sparse-sarif/tools/verify_pmd_capture.py \
            verify-promotion \
            --research-root validation/research/sparse-sarif \
            --capture-root "${RECAPTURE_ROOT}"
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  linux:
    name: Evaluate committed holdout (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload-evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-evidence.outputs.artifact-digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Multitool runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Install projection verifier runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.10'

      - name: Restore locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore SarifRegress.slnx --locked-mode

      - name: Verify repository
        shell: bash
        run: ./scripts/verify.sh

      - name: Evaluate holdout
        shell: bash
        run: |
          set -euo pipefail
          cd -- "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/scripts/validate-holdout.sh"

      - name: Upload Linux evaluation evidence
        id: upload-evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holdout-linux
          path: artifacts/holdout-validation
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Evaluate committed holdout (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload-evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-evidence.outputs.artifact-digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Multitool runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Install projection verifier runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.10'

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore SarifRegress.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) {
            throw "Locked solution restore failed with exit code $LASTEXITCODE."
          }

      - name: Verify repository
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Evaluate holdout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location -LiteralPath $env:RUNNER_TEMP
          try {
            & (Join-Path $env:GITHUB_WORKSPACE 'scripts/validate-holdout.ps1')
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows evaluation evidence
        id: upload-evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holdout-windows
          path: artifacts/holdout-validation
          if-no-files-found: warn
          retention-days: 30

  compare:
    name: Compare Linux and Windows normalized bytes
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          test "${actual_source_sha}" = "${EXPECTED_SOURCE_SHA}"

      - name: Install attestation serializer runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.10'

      - name: Download Linux evaluation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: holdout-linux
          path: artifacts/download/linux

      - name: Download Windows evaluation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: holdout-windows
          path: artifacts/download/windows

      - name: Verify normalized byte identity
        shell: bash
        run: |
          set -euo pipefail
          readonly verified_directory='artifacts/verified'
          mkdir -p "${verified_directory}"

          readonly reports=(
            'sarif-regress-holdout.json'
            'sarif-multitool-baseline.json'
            'v3-to-v3.1-delta.json'
            'comparison-summary.json'
            'checksums.sha256'
          )

          for report_name in "${reports[@]}"; do
            linux_report="artifacts/download/linux/${report_name}"
            windows_report="artifacts/download/windows/${report_name}"
            if [[ ! -f "${linux_report}" || ! -f "${windows_report}" ]]; then
              echo "Missing normalized report '${report_name}' from a producer job." >&2
              exit 1
            fi

            linux_hash="$(sha256sum "${linux_report}" | cut -d ' ' -f 1)"
            windows_hash="$(sha256sum "${windows_report}" | cut -d ' ' -f 1)"
            if [[ "${linux_hash}" != "${windows_hash}" ]]; then
              echo \
                "${report_name} hash differs: Linux ${linux_hash}, Windows ${windows_hash}." \
                >&2
              exit 1
            fi

            if ! cmp --silent -- "${linux_report}" "${windows_report}"; then
              echo "${report_name} bytes differ despite equal hashes." >&2
              exit 1
            fi
            cp -- "${linux_report}" "${verified_directory}/${report_name}"
          done

      - name: Create cross-platform artifact attestation projection
        shell: bash
        env:
          CHECKED_OUT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LINUX_ARTIFACT_ID: ${{ needs.linux.outputs.artifact_id }}
          LINUX_ARTIFACT_DIGEST: ${{ needs.linux.outputs.artifact_digest }}
          WINDOWS_ARTIFACT_ID: ${{ needs.windows.outputs.artifact_id }}
          WINDOWS_ARTIFACT_DIGEST: ${{ needs.windows.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path.cwd()
          verified = root / "artifacts" / "verified"
          linux = root / "artifacts" / "download" / "linux"
          windows = root / "artifacts" / "download" / "windows"
          maximum_bytes = 64 * 1024 * 1024
          sha256_pattern = re.compile(r"[0-9a-f]{64}")
          commit_pattern = re.compile(r"[0-9a-f]{40}")

          def read_bounded(path):
              size = path.stat().st_size
              if size <= 0 or size > maximum_bytes:
                  raise SystemExit(
                      f"Attestation input {path.name!r} has invalid size {size}.")
              return path.read_bytes()

          def sha256(path):
              return hashlib.sha256(read_bounded(path)).hexdigest()

          def reject_duplicate(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON property {key!r}")
                  result[key] = value
              return result

          def load_json(path):
              return json.loads(
                  read_bounded(path),
                  object_pairs_hook=reject_duplicate)

          def required_decimal(name, maximum=9_007_199_254_740_991):
              value = os.environ[name]
              if not re.fullmatch(r"[1-9][0-9]*", value):
                  raise SystemExit(f"{name} is not a positive decimal integer.")
              parsed = int(value)
              if parsed > maximum:
                  raise SystemExit(f"{name} exceeds its permitted range.")
              return parsed

          def required_sha256(name):
              value = os.environ[name]
              if sha256_pattern.fullmatch(value) is None or set(value) == {"0"}:
                  raise SystemExit(f"{name} is not a nonzero lowercase SHA-256.")
              return value

          def parse_checksum_manifest(path):
              text = read_bounded(path).decode("utf-8", errors="strict")
              if not text.endswith("\n") or "\r" in text:
                  raise SystemExit(f"{path.name} is not canonical LF text.")
              result = {}
              for line in text.splitlines():
                  match = re.fullmatch(
                      r"([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._/-]*)",
                      line)
                  if match is None or match.group(2) in result:
                      raise SystemExit(f"{path.name} contains an invalid entry.")
                  result[match.group(2)] = match.group(1)
              return result

          linux_artifact_id = required_decimal("LINUX_ARTIFACT_ID")
          windows_artifact_id = required_decimal("WINDOWS_ARTIFACT_ID")
          if linux_artifact_id == windows_artifact_id:
              raise SystemExit("Linux and Windows evidence reused one artifact ID.")
          linux_artifact_digest = required_sha256("LINUX_ARTIFACT_DIGEST")
          windows_artifact_digest = required_sha256("WINDOWS_ARTIFACT_DIGEST")

          report_names = (
              "sarif-regress-holdout.json",
              "sarif-multitool-baseline.json",
              "v3-to-v3.1-delta.json",
          )
          report_hashes = {}
          for name in report_names:
              linux_hash = sha256(linux / name)
              windows_hash = sha256(windows / name)
              verified_hash = sha256(verified / name)
              if linux_hash != windows_hash or linux_hash != verified_hash:
                  raise SystemExit(f"{name} changed after byte-identity verification.")
              report_hashes[name] = verified_hash

          metadata_path = root / "validation" / "holdout" / "evaluation-metadata.json"
          manifest_path = root / "validation" / "holdout" / "manifest.json"
          metadata_sha256 = sha256(metadata_path)
          manifest_sha256 = sha256(manifest_path)
          metadata = load_json(metadata_path)
          frozen_commit = metadata.get("repositoryCommitSha")
          if not isinstance(frozen_commit, str) or commit_pattern.fullmatch(
                  frozen_commit) is None:
              raise SystemExit("Evaluation metadata has no exact frozen commit SHA.")
          if metadata.get("holdoutManifestSha256") != manifest_sha256:
              raise SystemExit("Evaluation metadata does not hash the current manifest.")

          sarif_report = load_json(verified / report_names[0])
          multitool_report = load_json(verified / report_names[1])
          delta_report = load_json(verified / report_names[2])
          for name, report in (
                  (report_names[0], sarif_report),
                  (report_names[1], multitool_report)):
              evaluation = report.get("evaluation", {})
              if evaluation.get("repositoryCommitSha") != frozen_commit:
                  raise SystemExit(f"{name} does not identify the frozen commit.")
              if evaluation.get("holdoutManifestSha256") != manifest_sha256:
                  raise SystemExit(f"{name} does not identify the holdout manifest.")

          matcher_v3_history_root = (
              root / "validation" / "history" / "matcher-v3")
          matcher_v3_history_manifest_hash = sha256(
              matcher_v3_history_root / "checksums.sha256")
          matcher_v3_report_hash = sha256(
              matcher_v3_history_root / "sarif-regress-holdout.json")
          expected_delta_hashes = {
              "matcherV3HistoryChecksumManifestSha256":
                  matcher_v3_history_manifest_hash,
              "matcherV3ReportSha256": matcher_v3_report_hash,
              "matcherV31ReportSha256": report_hashes[report_names[0]],
              "holdoutManifestSha256": manifest_sha256,
          }
          if delta_report.get("inputHashes") != expected_delta_hashes:
              raise SystemExit(
                  "v3-to-v3.1-delta.json does not bind its exact inputs.")
          checksums = parse_checksum_manifest(verified / "checksums.sha256")
          required_checksums = {
              "validation/holdout/manifest.json": manifest_sha256,
              "validation/holdout/evaluation-metadata.json": metadata_sha256,
              "validation/expected/sarif-regress-holdout.json":
                  report_hashes[report_names[0]],
              "validation/expected/sarif-multitool-baseline.json":
                  report_hashes[report_names[1]],
              "validation/expected/v3-to-v3.1-delta.json":
                  report_hashes[report_names[2]],
              "validation/history/matcher-v3/checksums.sha256":
                  matcher_v3_history_manifest_hash,
              "validation/history/matcher-v3/sarif-regress-holdout.json":
                  matcher_v3_report_hash,
          }
          for name, expected in required_checksums.items():
              if checksums.get(name) != expected:
                  raise SystemExit(f"checksums.sha256 does not bind {name!r}.")

          comparison = load_json(verified / "comparison-summary.json")
          comparison_hashes = comparison.get("reportHashes", {})
          expected_comparison_hashes = {
              "holdoutManifestSha256": manifest_sha256,
              "evaluationMetadataSha256": metadata_sha256,
              "sarifRegressReportSha256": report_hashes[report_names[0]],
              "sarifMultitoolBaselineReportSha256": report_hashes[report_names[1]],
              "matcherV3ReportSha256": matcher_v3_report_hash,
              "v3ToV31DeltaReportSha256": report_hashes[report_names[2]],
          }
          if comparison_hashes != expected_comparison_hashes:
              raise SystemExit("comparison-summary.json does not bind the base inputs.")

          run_id = required_decimal("GITHUB_RUN_ID")
          run_attempt = required_decimal("GITHUB_RUN_ATTEMPT", maximum=1000)
          workflow_head = os.environ["CHECKED_OUT_SOURCE_SHA"]
          if commit_pattern.fullmatch(workflow_head) is None:
              raise SystemExit(
                  "CHECKED_OUT_SOURCE_SHA is not a lowercase commit SHA.")

          base_report_digests = {
              "sarifRegressHoldoutSha256": report_hashes[report_names[0]],
              "sarifMultitoolBaselineSha256": report_hashes[report_names[1]],
              "v3ToV31DeltaSha256": report_hashes[report_names[2]],
          }
          candidate = {
              "schemaVersion": "3",
              "repository": "ppcdaniel/sarif-regress",
              "repositoryCommitSha": frozen_commit,
              "holdoutManifestSha256": manifest_sha256,
              "evaluationMetadataSha256": metadata_sha256,
              "baseReports": base_report_digests,
              "githubActions": {
                  "workflowPath": ".github/workflows/holdout-validation.yml",
                  "runId": run_id,
                  "runAttempt": run_attempt,
                  "runUrl": (
                      "https://github.com/ppcdaniel/sarif-regress/actions/runs/"
                      f"{run_id}"),
                  "workflowHeadSha": workflow_head,
                  "conclusion": "success",
                  "coordinatorJobName":
                      "Compare Linux and Windows normalized bytes",
              },
              "artifacts": {
                  "linux": {
                      "name": "holdout-linux",
                      "artifactId": linux_artifact_id,
                      "archiveSha256": linux_artifact_digest,
                      "reportDigests": dict(base_report_digests),
                  },
                  "windows": {
                      "name": "holdout-windows",
                      "artifactId": windows_artifact_id,
                      "archiveSha256": windows_artifact_digest,
                      "reportDigests": dict(base_report_digests),
                  },
              },
              "byteIdentity": {
                  "sarifRegressHoldout": True,
                  "sarifMultitoolBaseline": True,
                  "v3ToV31Delta": True,
              },
          }
          candidate_bytes = (
              json.dumps(candidate, ensure_ascii=False, indent=2) + "\n"
          ).encode("utf-8")
          candidate_path = verified / "cross-platform-attestation.json"
          candidate_path.write_bytes(candidate_bytes)

          coordinator_files = (
              "checksums.sha256",
              "comparison-summary.json",
              "cross-platform-attestation.json",
              "sarif-multitool-baseline.json",
              "sarif-regress-holdout.json",
              "v3-to-v3.1-delta.json",
          )
          coordinator_manifest = "".join(
              f"{sha256(verified / name)}  {name}\n"
              for name in coordinator_files)
          (verified / "cross-platform-checksums.sha256").write_bytes(
              coordinator_manifest.encode("ascii"))
          PY

      - name: Upload cross-platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holdout-cross-platform
          path: artifacts/verified
          if-no-files-found: error
          retention-days: 30
