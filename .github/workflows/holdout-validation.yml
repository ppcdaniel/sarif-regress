name: Independent holdout validation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.config/dotnet-tools.json'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'SarifRegress.slnx'
      - 'corpus/schema/**'
      - 'scripts/validate-holdout.ps1'
      - 'scripts/validate-holdout.sh'
      - 'schemas/**'
      - 'src/SarifRegress.Cli/Corpus/**'
      - 'src/SarifRegress.Core/Configuration/**'
      - 'src/SarifRegress.Core/Findings/**'
      - 'src/SarifRegress.Core/Matching/**'
      - 'src/SarifRegress.Core/Paths/**'
      - 'src/SarifRegress.Match/**'
      - 'src/SarifRegress.Sarif/Canonicalization/**'
      - 'src/SarifRegress.Sarif/Configuration/**'
      - 'src/SarifRegress.Sarif/Fingerprints/**'
      - 'src/SarifRegress.Sarif/Ingestion/**'
      - 'src/SarifRegress.Sarif/Repository/**'
      - 'src/SarifRegress.Report/**'
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Evaluate committed holdout (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Multitool runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Install projection verifier runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.13'

      - name: Restore locked dependencies and local tools
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore SarifRegress.slnx --locked-mode
          dotnet tool restore

      - name: Verify repository
        shell: bash
        run: ./scripts/verify.sh

      - name: Evaluate holdout
        shell: bash
        run: ./scripts/validate-holdout.sh

      - name: Upload Linux evaluation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holdout-linux
          path: artifacts/holdout-validation
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Evaluate committed holdout (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Multitool runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423

      - name: Install projection verifier runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.13'

      - name: Restore locked dependencies and local tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore SarifRegress.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) {
            throw "Locked solution restore failed with exit code $LASTEXITCODE."
          }
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) {
            throw "Local tool restore failed with exit code $LASTEXITCODE."
          }

      - name: Verify repository
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Evaluate holdout
        shell: pwsh
        run: .\scripts\validate-holdout.ps1

      - name: Upload Windows evaluation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holdout-windows
          path: artifacts/holdout-validation
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare Linux and Windows normalized bytes
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Linux evaluation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: holdout-linux
          path: artifacts/download/linux

      - name: Download Windows evaluation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: holdout-windows
          path: artifacts/download/windows

      - name: Verify normalized byte identity
        shell: bash
        run: |
          set -euo pipefail
          readonly verified_directory='artifacts/verified'
          mkdir -p "${verified_directory}"

          readonly reports=(
            'sarif-regress-holdout.json'
            'sarif-multitool-baseline.json'
            'comparison-summary.json'
            'checksums.sha256'
          )

          for report_name in "${reports[@]}"; do
            linux_report="artifacts/download/linux/${report_name}"
            windows_report="artifacts/download/windows/${report_name}"
            if [[ ! -f "${linux_report}" || ! -f "${windows_report}" ]]; then
              echo "Missing normalized report '${report_name}' from a producer job." >&2
              exit 1
            fi

            linux_hash="$(sha256sum "${linux_report}" | cut -d ' ' -f 1)"
            windows_hash="$(sha256sum "${windows_report}" | cut -d ' ' -f 1)"
            if [[ "${linux_hash}" != "${windows_hash}" ]]; then
              echo \
                "${report_name} hash differs: Linux ${linux_hash}, Windows ${windows_hash}." \
                >&2
              exit 1
            fi

            if ! cmp --silent -- "${linux_report}" "${windows_report}"; then
              echo "${report_name} bytes differ despite equal hashes." >&2
              exit 1
            fi
            cp -- "${linux_report}" "${verified_directory}/${report_name}"
          done

          (
            cd "${verified_directory}"
            LC_ALL=C sha256sum \
              checksums.sha256 \
              comparison-summary.json \
              sarif-multitool-baseline.json \
              sarif-regress-holdout.json \
              > cross-platform-checksums.sha256
          )

      - name: Upload cross-platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holdout-cross-platform
          path: artifacts/verified
          if-no-files-found: error
          retention-days: 30
