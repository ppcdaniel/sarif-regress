name: Cross-platform determinism

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  produce:
    name: Produce deterministic reports (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
          - label: windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/build.sh

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Produce deterministic reports on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/determinism
          dotnet run \
            --project src/SarifRegress.Cli/SarifRegress.Cli.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            corpus run \
            --corpus corpus \
            --json-out artifacts/determinism/corpus-report.json
          for dataset in unique pathological; do
            dotnet run \
              --project src/SarifRegress.Cli/SarifRegress.Cli.csproj \
              --configuration Release \
              --no-build \
              --no-restore \
              -- \
              bench \
              --size 1000 \
              --dataset "${dataset}" \
              --json-out "artifacts/determinism/benchmark-${dataset}-report.json" \
              --deterministic-out \
                "artifacts/determinism/benchmark-${dataset}-deterministic.json"
          done

      - name: Produce deterministic reports on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/determinism | Out-Null
          & dotnet run `
            --project src/SarifRegress.Cli/SarifRegress.Cli.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            -- `
            corpus run `
            --corpus corpus `
            --json-out artifacts/determinism/corpus-report.json
          if ($LASTEXITCODE -ne 0) {
            throw "Corpus evaluation failed with exit code $LASTEXITCODE."
          }
          foreach ($dataset in @('unique', 'pathological')) {
            & dotnet run `
              --project src/SarifRegress.Cli/SarifRegress.Cli.csproj `
              --configuration Release `
              --no-build `
              --no-restore `
              -- `
              bench `
              --size 1000 `
              --dataset $dataset `
              --json-out `
                "artifacts/determinism/benchmark-$dataset-report.json" `
              --deterministic-out `
                "artifacts/determinism/benchmark-$dataset-deterministic.json"
            if ($LASTEXITCODE -ne 0) {
              throw "Benchmark $dataset failed with exit code $LASTEXITCODE."
            }
          }

      - name: Upload deterministic reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: determinism-${{ matrix.label }}
          path: artifacts/determinism
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare Windows and Linux report bytes
    needs: produce
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Linux report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: determinism-linux
          path: artifacts/download/linux

      - name: Download Windows report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: determinism-windows
          path: artifacts/download/windows

      - name: Verify byte-identical reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/verified
          for report_name in \
            corpus-report.json \
            benchmark-unique-deterministic.json \
            benchmark-pathological-deterministic.json
          do
            linux_report="artifacts/download/linux/${report_name}"
            windows_report="artifacts/download/windows/${report_name}"
            linux_hash="$(sha256sum "${linux_report}" | cut -d ' ' -f 1)"
            windows_hash="$(sha256sum "${windows_report}" | cut -d ' ' -f 1)"
            if [[ "${linux_hash}" != "${windows_hash}" ]]; then
              echo \
                "${report_name} hash differs: Linux ${linux_hash}, Windows ${windows_hash}." \
                >&2
              exit 1
            fi
            if ! cmp --silent -- "${linux_report}" "${windows_report}"; then
              echo "${report_name} bytes differ despite equal hashes." >&2
              exit 1
            fi
            cp -- "${linux_report}" "artifacts/verified/${report_name}"
          done
          (
            cd artifacts/verified
            LC_ALL=C sha256sum \
              benchmark-pathological-deterministic.json \
              benchmark-unique-deterministic.json \
              corpus-report.json \
              > checksums.sha256
          )

      - name: Upload verified cross-platform report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-platform-determinism
          path: artifacts/verified
          if-no-files-found: error
          retention-days: 30
