name: Cross-platform determinism

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    name: Produce approved corpus report (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
          - label: windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/build.sh

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Produce approved corpus report on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts/determinism
          dotnet run \
            --project src/SarifRegress.Cli/SarifRegress.Cli.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            corpus run \
            --corpus corpus \
            --json-out artifacts/determinism/corpus-report.json
          dotnet run \
            --project src/SarifRegress.Cli/SarifRegress.Cli.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            bench \
            --size 1000 \
            --dataset unique \
            --enforce-budgets \
            --json-out artifacts/determinism/benchmark-report.json

      - name: Produce approved corpus report on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/determinism | Out-Null
          & dotnet run `
            --project src/SarifRegress.Cli/SarifRegress.Cli.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            -- `
            corpus run `
            --corpus corpus `
            --json-out artifacts/determinism/corpus-report.json
          if ($LASTEXITCODE -ne 0) {
            throw "Corpus evaluation failed with exit code $LASTEXITCODE."
          }
          & dotnet run `
            --project src/SarifRegress.Cli/SarifRegress.Cli.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            -- `
            bench `
            --size 1000 `
            --dataset unique `
            --enforce-budgets `
            --json-out artifacts/determinism/benchmark-report.json
          if ($LASTEXITCODE -ne 0) {
            throw "Benchmark budget failed with exit code $LASTEXITCODE."
          }

      - name: Upload deterministic report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: determinism-${{ matrix.label }}
          path: artifacts/determinism
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare Windows and Linux report bytes
    needs: produce
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: determinism-linux
          path: artifacts/download/linux

      - name: Download Windows report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: determinism-windows
          path: artifacts/download/windows

      - name: Verify byte-identical reports
        shell: bash
        run: |
          set -euo pipefail
          linux_report="artifacts/download/linux/corpus-report.json"
          windows_report="artifacts/download/windows/corpus-report.json"
          linux_hash="$(sha256sum "${linux_report}" | cut -d ' ' -f 1)"
          windows_hash="$(sha256sum "${windows_report}" | cut -d ' ' -f 1)"
          test "${linux_hash}" = "${windows_hash}"
          cmp --silent -- "${linux_report}" "${windows_report}"
          mkdir -p artifacts/verified
          cp -- "${linux_report}" artifacts/verified/corpus-report.json
          jq -S \
            'del(.observations, .budget.passed, .budget.failureCodes)' \
            artifacts/download/linux/benchmark-report.json \
            > artifacts/verified/benchmark-linux.json
          jq -S \
            'del(.observations, .budget.passed, .budget.failureCodes)' \
            artifacts/download/windows/benchmark-report.json \
            > artifacts/verified/benchmark-windows.json
          cmp --silent \
            artifacts/verified/benchmark-linux.json \
            artifacts/verified/benchmark-windows.json
          mv \
            artifacts/verified/benchmark-linux.json \
            artifacts/verified/benchmark-deterministic.json
          rm -- artifacts/verified/benchmark-windows.json
          (
            cd artifacts/verified
            LC_ALL=C sha256sum \
              benchmark-deterministic.json \
              corpus-report.json \
              > checksums.sha256
          )

      - name: Upload verified cross-platform report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-platform-determinism
          path: artifacts/verified
          if-no-files-found: error
          retention-days: 30
