name: Release artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  holdout:
    name: Produce exact-head holdout evidence
    uses: ./.github/workflows/holdout-validation.yml

  release-readiness:
    name: Enforce release-channel readiness
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: holdout
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install release-gate runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.10'

      - name: Authenticate exact holdout artifact metadata
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.holdout.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.holdout.outputs.artifact_id }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          test "${EXPECTED_ARTIFACT_DIGEST}" != "$(printf '0%.0s' {1..64})"
          readonly metadata_path="${RUNNER_TEMP}/release-holdout-artifact.json"
          curl \
            --disable \
            --fail-with-body \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --location \
            --proto '=https' \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "${metadata_path}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}"
          jq -e \
            --arg artifact_digest "sha256:${EXPECTED_ARTIFACT_DIGEST}" \
            --arg artifact_id "${EXPECTED_ARTIFACT_ID}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg source_sha "${EXPECTED_SOURCE_SHA}" \
            '(.id | tostring) == $artifact_id and
             .name == "holdout-cross-platform" and
             .digest == $artifact_digest and
             .expired == false and
             (.workflow_run.id | tostring) == $run_id and
             .workflow_run.head_sha == $source_sha' \
            "${metadata_path}" >/dev/null

      - name: Download exact holdout evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.holdout.outputs.artifact_id }}
          path: artifacts/release-holdout
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Authenticate evidence and enforce channel policy
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -euo pipefail
          unset PYTHONPATH || true
          python -B validation/tools/release/test_verify_release_gate.py -v
          python -B validation/tools/release/verify_release_gate.py \
            --repository-root . \
            --evidence-root artifacts/release-holdout \
            --source-sha "${EXPECTED_SOURCE_SHA}" \
            --tag "${RELEASE_TAG}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"

  cross-platform-determinism:
    name: Verify release determinism
    uses: ./.github/workflows/determinism.yml

  verify:
    name: Verify release source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify.sh

      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify.ps1

  package:
    name: Build release bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Package .NET tool and self-contained binaries
        shell: bash
        run: ./scripts/package.sh

      - name: Record the exact source commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse 'HEAD^{commit}' > artifacts/release/source-commit.txt

      - name: Enforce labelled-corpus quality gates
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \
            --project src/SarifRegress.Cli/SarifRegress.Cli.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            corpus run \
            --corpus corpus \
            --json-out artifacts/release/corpus-report.json
          for dataset in unique pathological; do
            dotnet run \
              --project src/SarifRegress.Cli/SarifRegress.Cli.csproj \
              --configuration Release \
              --no-build \
              --no-restore \
              -- \
              bench \
              --size 1000 \
              --dataset "${dataset}" \
              --enforce-budgets \
              --json-out "artifacts/release/benchmark-${dataset}.json" \
              --deterministic-out \
                "artifacts/release/benchmark-${dataset}-deterministic.json"
          done

      - name: Add corpus metrics to the release manifest
        shell: bash
        working-directory: artifacts/release
        run: |
          set -euo pipefail
          LC_ALL=C sha256sum \
            ./*.nupkg \
            ./benchmark-*.json \
            ./corpus-report.json \
            ./sarif-regress-linux-x64 \
            ./sarif-regress-win-x64.exe \
            ./source-commit.txt |
            sed 's#  \./#  #' > checksums.sha256

      - name: Verify release checksums
        shell: bash
        working-directory: artifacts/release
        run: sha256sum --check checksums.sha256

      - name: Confirm tag and package versions agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_path="artifacts/release/SarifRegress.Tool.${tag_version}.nupkg"
          if [[ ! -f "${package_path}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the package version." >&2
            exit 1
          fi

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-regress-release
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30

  smoke-release-bundle:
    name: Smoke exact release bundle (${{ matrix.label }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
          - label: windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download exact release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sarif-regress-release
          path: release

      - name: Verify and execute exact Linux assets
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/release-nuget-packages
        run: |
          set -euo pipefail
          (
            cd release
            sha256sum --check checksums.sha256
          )
          chmod 755 release/sarif-regress-linux-x64
          release/sarif-regress-linux-x64 --help >/dev/null
          shopt -s nullglob
          package_files=(release/SarifRegress.Tool.*.nupkg)
          test "${#package_files[@]}" -eq 1
          package_name="$(basename -- "${package_files[0]}")"
          package_version="${package_name#SarifRegress.Tool.}"
          package_version="${package_version%.nupkg}"
          dotnet tool install \
            --tool-path release-tool \
            --configfile NuGet.ReleaseSmoke.config \
            --no-cache \
            SarifRegress.Tool \
            --version "${package_version}"
          mapfile -d '' installed_package_files < <(
            find release-tool/.store \
              -type f \
              -iname 'sarifregress.tool.*.nupkg' \
              -print0
          )
          test "${#installed_package_files[@]}" -eq 1
          cmp --silent -- \
            "${package_files[0]}" \
            "${installed_package_files[0]}"
          release-tool/sarif-regress --help >/dev/null

      - name: Verify and execute exact Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/release-nuget-packages
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($line in Get-Content release/checksums.sha256) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2) {
              throw "Invalid checksum manifest line."
            }

            $actual = (
              Get-FileHash `
                -LiteralPath (Join-Path release $parts[1]) `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) {
              throw "Checksum mismatch for $($parts[1])."
            }
          }

          & .\release\sarif-regress-win-x64.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "The exact Windows release executable failed."
          }

          $packageFiles = @(
            Get-ChildItem `
              -LiteralPath release `
              -Filter 'SarifRegress.Tool.*.nupkg' `
              -File
          )
          $packageMatch = if ($packageFiles.Count -eq 1) {
            [regex]::Match(
              $packageFiles[0].Name,
              '^SarifRegress\.Tool\.(.+)\.nupkg$')
          }
          if ($packageFiles.Count -ne 1 -or -not $packageMatch.Success) {
            throw 'Expected exactly one versioned .NET tool package.'
          }

          $packageVersion = $packageMatch.Groups[1].Value
          & dotnet tool install `
            --tool-path release-tool `
            --configfile NuGet.ReleaseSmoke.config `
            --no-cache `
            SarifRegress.Tool `
            --version $packageVersion
          if ($LASTEXITCODE -ne 0) {
            throw "The exact .NET tool package could not be installed."
          }

          $installedPackageFiles = @(
            Get-ChildItem `
              -LiteralPath (Join-Path release-tool '.store') `
              -Filter 'sarifregress.tool.*.nupkg' `
              -File `
              -Recurse
          )
          if ($installedPackageFiles.Count -ne 1) {
            throw "Expected one installed .NET tool package."
          }

          $sourcePackageHash = (
            Get-FileHash `
              -LiteralPath $packageFiles[0].FullName `
              -Algorithm SHA256
          ).Hash
          $installedPackageHash = (
            Get-FileHash `
              -LiteralPath $installedPackageFiles[0].FullName `
              -Algorithm SHA256
          ).Hash
          $installedPackageDiffers = (
            $installedPackageFiles[0].Length -ne $packageFiles[0].Length -or
            $installedPackageHash -ne $sourcePackageHash
          )
          if ($installedPackageDiffers) {
            throw "The installed tool package bytes differ from the bundle."
          }

          & .\release-tool\sarif-regress.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "The exact installed .NET tool failed."
          }

  create-release-draft:
    name: Create tagged GitHub release draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - cross-platform-determinism
      - package
      - release-readiness
      - smoke-release-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sarif-regress-release
          path: release

      - name: Verify downloaded checksums
        shell: bash
        working-directory: release
        run: sha256sum --check checksums.sha256

      - name: Create draft with verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          expected_commit="$(
            tr -d '\r\n' < release/source-commit.txt
          )"
          if [[ ! "${expected_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release bundle has an invalid source commit." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${expected_commit}" ]]; then
            echo "Release notes and bundle come from different commits." >&2
            exit 1
          fi
          test -f docs/release-notes-v0.1.0.md
          test ! -L docs/release-notes-v0.1.0.md
          read -r tag_object tag_type < <(
            gh api \
              "repos/${GH_REPO}/git/ref/tags/${GITHUB_REF_NAME}" \
              --jq '[.object.sha, .object.type] | @tsv'
          )
          for _ in {1..8}; do
            if [[ "${tag_type}" == "commit" ]]; then
              break
            fi
            if [[ "${tag_type}" != "tag" ]]; then
              echo "Release tag does not resolve to a commit." >&2
              exit 1
            fi
            read -r tag_object tag_type < <(
              gh api \
                "repos/${GH_REPO}/git/tags/${tag_object}" \
                --jq '[.object.sha, .object.type] | @tsv'
            )
          done
          if [[ "${tag_type}" != "commit" ||
                "${tag_object}" != "${expected_commit}" ]]; then
            echo \
              "Release tag resolves to ${tag_object}, but the bundle was built from ${expected_commit}." \
              >&2
            exit 1
          fi
          release_flags=(
            --draft
            --verify-tag
            --generate-notes
            --notes-file docs/release-notes-v0.1.0.md
            --title "SarifRegress ${GITHUB_REF_NAME}"
          )
          tag_without_build="${GITHUB_REF_NAME%%+*}"
          if [[ "${tag_without_build}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create \
            "${GITHUB_REF_NAME}" \
            release/*.nupkg \
            release/benchmark-*.json \
            release/corpus-report.json \
            release/sarif-regress-linux-x64 \
            release/sarif-regress-win-x64.exe \
            release/source-commit.txt \
            release/checksums.sha256 \
            "${release_flags[@]}"
