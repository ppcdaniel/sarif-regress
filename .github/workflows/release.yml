name: Release artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify.sh

      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify.ps1

  package:
    name: Build release bundle
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Package .NET tool and self-contained binaries
        shell: bash
        run: ./scripts/package.sh

      - name: Enforce labelled-corpus quality gates
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \
            --project src/SarifRegress.Cli/SarifRegress.Cli.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            corpus run \
            --corpus corpus \
            --json-out artifacts/release/corpus-report.json
          for dataset in unique pathological; do
            dotnet run \
              --project src/SarifRegress.Cli/SarifRegress.Cli.csproj \
              --configuration Release \
              --no-build \
              --no-restore \
              -- \
              bench \
              --size 1000 \
              --dataset "${dataset}" \
              --enforce-budgets \
              --json-out "artifacts/release/benchmark-${dataset}.json"
          done

      - name: Add corpus metrics to the release manifest
        shell: bash
        working-directory: artifacts/release
        run: |
          set -euo pipefail
          LC_ALL=C sha256sum \
            ./*.nupkg \
            ./benchmark-*.json \
            ./corpus-report.json \
            ./sarif-regress-linux-x64 \
            ./sarif-regress-win-x64.exe |
            sed 's#  \./#  #' > checksums.sha256

      - name: Verify release checksums
        shell: bash
        working-directory: artifacts/release
        run: sha256sum --check checksums.sha256

      - name: Confirm tag and package versions agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_path="artifacts/release/SarifRegress.Tool.${tag_version}.nupkg"
          if [[ ! -f "${package_path}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the package version." >&2
            exit 1
          fi

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-regress-release
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sarif-regress-release
          path: release

      - name: Verify downloaded checksums
        shell: bash
        working-directory: release
        run: sha256sum --check checksums.sha256

      - name: Publish immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create \
            "${GITHUB_REF_NAME}" \
            release/*.nupkg \
            release/benchmark-*.json \
            release/corpus-report.json \
            release/sarif-regress-linux-x64 \
            release/sarif-regress-win-x64.exe \
            release/checksums.sha256 \
            --verify-tag \
            --generate-notes \
            --title "SarifRegress ${GITHUB_REF_NAME}"
